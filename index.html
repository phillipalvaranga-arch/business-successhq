<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Business SuccessHQ</title>
  <meta name="description" content="Capture any business idea, score it, validate it, plan it, and track your progress. Your information stays on this device.">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SuccessHQ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="icon" href="icon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var t = localStorage.getItem("bizhq-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="rail" aria-expanded="false">
        <span class="menu-bars" aria-hidden="true"></span>
      </button>
      <a class="brand" href="#/home">
        <img src="icons/icon-192.png" width="40" height="40" alt="">
        <span class="brand-text">
          <span class="brand-name"><span class="brand-full">Business </span>SuccessHQ</span>
          <span class="brand-sub">Ideas, plans, and progress</span>
        </span>
      </a>
      <div class="top-actions">
        <button type="button" id="themeBtn" class="btn ghost">Dark mode</button>
        <a class="btn ghost hide-sm" href="#/about">About</a>
      </div>
    </header>

    <div class="workspace">
      <div class="rail-backdrop" id="railBackdrop" hidden></div>
      <nav class="rail" id="rail" aria-label="Main"></nav>
      <main id="main" tabindex="-1">
        <div id="view"></div>
      </main>
    </div>

    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
